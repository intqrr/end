name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Build release
        run: cargo build --release --bin kochora

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kochora-windows
          path: target/release/kochora.exe